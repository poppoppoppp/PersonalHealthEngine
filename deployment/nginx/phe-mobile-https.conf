server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/47.111.229.39/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.111.229.39/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PHE_TLS:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/phe-mobile-access.log;
    error_log /var/log/nginx/phe-mobile-error.log warn;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8707;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
