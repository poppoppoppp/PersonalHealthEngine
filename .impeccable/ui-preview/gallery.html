<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#EDEAE3;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;padding:26px 0 60px;}
h1{font-size:22px;font-weight:800;color:#191C20;text-align:center;margin-bottom:6px;}
p.sub{text-align:center;font-size:13.5px;color:#6b6f76;margin-bottom:26px;line-height:1.7;}
.shot{max-width:430px;margin:0 auto 34px;}
.shot h2{font-size:15px;font-weight:800;color:#191C20;margin-bottom:10px;padding-left:14px;border-left:4px solid #C0492E;padding-left:12px;}
.shot img{width:100%;border-radius:18px;box-shadow:0 6px 24px rgba(30,30,40,.18);display:block;}
.tip{text-align:center;font-size:13px;color:#8a8e96;margin-top:8px;}
</style></head>
<body>
<h1>晨间简报 · 全套五页效果图</h1>
<p class="sub">滚动查看五个页面。看完回到对话框回复「通过」，或说出想改的地方。</p>

<div class="shot"><h2>1 · 今日（头版结论）</h2><img src="shot-b.png"><div class="tip">大标题结论 + 导语原因 + 今日要闻三条</div></div>
<div class="shot"><h2>2 · 历史（数据回看）</h2><img src="shot-history.png"><div class="tip">14 晚趋势 + 睡眠结构 + 身体变化记录</div></div>
<div class="shot"><h2>3 · 问答（问我的状态）</h2><img src="shot-qa.png"><div class="tip">回答像专栏文章，你的问题在右侧墨块</div></div>
<div class="shot"><h2>4 · 我的规律（观察记录）</h2><img src="shot-patterns.png"><div class="tip">已确认规律 / 正在观察 / 数据不足 三档</div></div>
<div class="shot"><h2>5 · 我的（版权页）</h2><img src="shot-me.png"><div class="tip">通知订阅 + 关于 + 技术信息小字</div></div>

</body></html>
